server:
  port: 8080

spring:
  datasource:
    # H2 数据文件放 D 盘本地盘（云桌面数据盘）。
    # 不放 Z: —— Z 是阿里云 NAS 网络盘，云桌面夜间断网时 SMB 写盘会报
    # "意外的网络错误"甚至损坏库文件（2026-09-07/08 两次实际发生）。
    # 不放 C: —— 系统盘空间紧张（用户要求）。
    # 旧库位置: <项目>/data/config.mv.db，迁移=停机后复制到 D:/feishu-claude-data/config.mv.db
    # 跨平台：Linux/macOS 部署时用环境变量覆盖，如 FEISHU_DB_PATH=/opt/feishu-claude-data/config
    url: jdbc:h2:file:${FEISHU_DB_PATH:D:/feishu-claude-data/config};WRITE_DELAY=2000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    com.lark.oapi.sample.ws: INFO
    org.springframework: INFO

# 机器人互 @ 防死循环：同一群/话题连续收到这么多条机器人消息（中间无人发言）就暂停回复，有人发言自动恢复
feishu:
  loop-guard:
    max-bot-turns: 10
    idle-reset-minutes: 10
    bot-open-ids: ""   # 额外视为机器人的 open_id（逗号分隔）；sender_type=app 的消息已自动识别
  # 供应商知识库解析产物目录（与 H2 同盘：本地盘，不放 Z: NAS）
  # 跨平台部署用环境变量覆盖：FEISHU_KB_PATH=/opt/feishu-claude-data/supplier-kb
  kb-dir: ${FEISHU_KB_PATH:D:/feishu-claude-data/supplier-kb}

# 数字员工自动 PR（GitPrService）
employee:
  pr:
    repo-command: "git qpr"        # 需求工作区合并回跟踪分支后执行的提交评审命令；repo 工程兜底流程同样使用
    branch-prefix: "feishu-claude" # 分支名：<prefix>/<员工>-<任务>-<时间>
    default-base: ""               # 全局默认目标分支；空 = 自动探测远端默认分支（员工上可单独覆盖）
    timeout-seconds: 180
    gh-command: "gh"               # GitHub CLI；未安装时只推送分支并给出链接
