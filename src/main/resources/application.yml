server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/config
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    com.lark.oapi.sample.ws: INFO
    org.springframework: INFO
